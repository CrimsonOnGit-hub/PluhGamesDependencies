<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PluhUs Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="task-list">
            <h3 style="margin:0; color:#ff4747;">Impostor</h3>
            <p>Sabotage and kill everyone.</p>
        </div>

        <div id="hud-buttons">
            <div id="use-btn" class="action-btn">USE (Spc)</div>
            <div id="sabotage-btn" class="action-btn active-sabotage" onclick="toggleSabotageMap()">SABO (F)</div>
            <div id="kill-btn" class="action-btn">KILL (E)</div>
            <div id="report-btn" class="action-btn">REPORT (R)</div>
        </div>

        <div id="sabotage-layer" style="display: none;">
            <div id="sabo-map-container">
                <h2 style="color: #ff4747; text-align: center; margin-top: 0;">SABOTAGE MAP</h2>
                <div id="sabo-map">
                    <div class="map-room" style="top: 0; left: 0; width: 20%; height: 100%;"></div>
                    <div class="map-room" style="top: 20%; left: 50%; width: 30%; height: 46%;"></div>
                    
                    <button id="sabo-lights" class="sabo-icon lights-icon" style="top: 10%; left: 45%;" onclick="triggerSabotage('lights')">⚡</button>
                    <button id="sabo-door-1" class="sabo-icon door-icon" style="top: 50%; left: 15%;" onclick="triggerSabotage('door-1')">🚪</button>
                    <button id="sabo-door-2" class="sabo-icon door-icon" style="top: 45%; left: 45%;" onclick="triggerSabotage('door-2')">🚪</button>
                </div>
                <button class="vote-btn skip-btn" style="margin-top: 15px; width: 100%;" onclick="toggleSabotageMap()">Close Map</button>
            </div>
        </div>
        
        <div id="voting-layer" style="display: none;">
            <div id="tablet-screen">
                <h2 id="voting-title">Emergency Meeting</h2>
                <div id="chat-box"></div>
                
                <div id="quick-chat-ui">
                    <select id="quick-chat-select" class="chat-select">
                        <option value="" disabled selected>-- Quick Chat --</option>
                        <optgroup label="General">
                            <option value="Where?">Where?</option>
                            <option value="Who?">Who?</option>
                            <option value="I was doing tasks.">I was doing tasks.</option>
                            <option value="Any proof?">Any proof?</option>
                            <option value="Skip vote.">Skip vote.</option>
                        </optgroup>
                        <optgroup id="qc-accuse" label="Accuse">
                            </optgroup>
                    </select>
                    <button class="vote-btn" style="padding: 10px 20px;" onclick="sendPlayerChat()">Send</button>
                </div>

                <div id="voting-buttons"></div>
            </div>
        </div>

        <div id="task-layer" style="display: none;">
            <div id="task-screen">
                <h2>Fix Lights</h2>
                <p>Flip all switches UP to restore power!</p>
                <div id="switches-container">
                    <div class="switch off" onclick="toggleSwitch(this)"></div>
                    <div class="switch off" onclick="toggleSwitch(this)"></div>
                    <div class="switch off" onclick="toggleSwitch(this)"></div>
                    <div class="switch off" onclick="toggleSwitch(this)"></div>
                    <div class="switch off" onclick="toggleSwitch(this)"></div>
                </div>
                <button class="vote-btn skip-btn" onclick="closeTask()">Close</button>
            </div>
        </div>

        <div id="end-screen" style="display: none;">
            <h1 id="end-text"></h1>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
