Z<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PluhGames Legacy</title>
    <style>
        body {
            background-color: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: #333333;
            text-align: center;
        }

        .container {
            margin: auto;
            max-width: 600px;
        }

        .icon {
            font-size: 72px;
            font-weight: bold;
            color: #d9534f;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            line-height: 1.5;
        }

        a {
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        footer {
            font-size: 14px;
            color: #666666;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">⚠️</div>
        <h1>PluhGames Legacy is no longer supported</h1>
        <p>Please go to the new website <a href="https://github.io">pluhmath.github.io</a> to continue playing on PluhMath.</p>
    </div>

    <footer>
        &copy; PluhMath 2026. All rights reserved. PluhMath is a subsidiary of Sequence Inc.
    </footer>

</body>
</html>
